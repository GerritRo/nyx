name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
    branches: [publish/pypi]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        default: testpypi
        options: [testpypi, pypi]
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Verify bundled data files are included
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'nyx/data/.*\.dat' \
            || { echo "::error::Wheel is missing nyx/data/*.dat files" && exit 1; }
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "
          import nyx
          print('imported nyx', nyx.__version__)"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(ls dist/*.tar.gz | sed -E 's/.*nyx_astro-(.*)\.tar\.gz/\1/')
          test "$tag" = "$pkg" || { echo "::error::tag $tag != version $pkg" && exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Manual rehearsal runs default to TestPyPI. Tag pushes always go to the real index.
  publish-testpypi:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.target != 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nyx-astro
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nyx-astro
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1