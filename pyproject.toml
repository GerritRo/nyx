[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx"
dynamic = ["version"]
description = "Python package for simulating sky brightness and instrumental noise in astronomical observations"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "licenses/DATA.rst"]
authors = [
    {name = "Gerrit Roellinghoff", email = "gerrit.roellinghoff@fau.de"}
]
maintainers = [
    {name = "Gerrit Roellinghoff", email = "gerrit.roellinghoff@fau.de"}
]
keywords = [
    "sky-brightness",
    "atmosphere",
    "astronomy",
    "astrophysics",
    "jax",
    "differentiable",
    "healpix",
    "zodiacal-light",
    "airglow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "astropy>=6.0",
    "healpy>=1.16",
    "jax-healpy>=0.3",
    "dust_extinction>=1.3",
    "jax>=0.4.25",
    "equinox>=0.11",
    "optimistix>=0.0.7",
]

[project.optional-dependencies]
iactrace = [
    "iactrace",
]
numpyro = [
    "numpyro",
    "corner",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "commitizen>=3.12.0",
    "matplotlib",
    "numpyro",
]
docs = [
    "sphinx",
    "furo",
    "sphinx-automodapi",
    "sphinx-design",
    "myst-nb",
]

[project.urls]
Homepage = "https://github.com/GerritRo/nyx"
Documentation = "https://gerritro.github.io/nyx/"
Repository = "https://github.com/GerritRo/nyx.git"
Issues = "https://github.com/GerritRo/nyx/issues"

[tool.setuptools.packages.find]
include = ["nyx*"]

[tool.setuptools.package-data]
nyx = ["py.typed"]
"nyx.data" = ["*.dat"]

[tool.setuptools.dynamic]
version = {attr = "nyx.__version__"}

[tool.mypy]
python_version = "3.12"
warn_return_any = false              # JAX stubs return Any a lot
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
follow_imports = "silent"
files = ["nyx/core", "nyx/infer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "T10"]
ignore = [
    "E501",   # line length
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
omit = [
    "nyx/__init*",
    "nyx/version*",
    "nyx/tests/*",
    "nyx/*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

# -- Commitizen (conventional commits + changelog) --
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = [
    "nyx/__init__.py:__version__",
    "CITATION.cff:^version",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
